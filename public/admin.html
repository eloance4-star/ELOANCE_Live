<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELOANCE | Admin Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 215, 0, 0.2); }
    </style>
</head>
<body class="p-6 max-w-7xl mx-auto space-y-8">
    <div class="glass-panel p-6 rounded-2xl flex justify-between items-center">
        <div>
            <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">Restricted Owner Panel</span>
            <h1 class="text-2xl font-extrabold">ELOANCE Business Control Center</h1>
        </div>
        <a href="/" class="px-4 py-2 bg-gray-900 text-gray-400 font-bold text-xs rounded-xl">&larr; Back to Website</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <!-- Add / Edit Store Product Form -->
        <div class="glass-panel p-8 rounded-3xl space-y-6">
            <h2 class="text-xl font-extrabold text-amber-400"><i class="fa-solid fa-plus-circle mr-2"></i> Add Laptop / Product to Store</h2>
            <form onsubmit="addNewProduct(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Product Title</label>
                    <input type="text" id="p-title" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white" placeholder="e.g. MacBook Pro M2 or Dell XPS">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Price ($)</label>
                        <input type="number" id="p-price" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white" placeholder="699">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-1">Original Price ($)</label>
                        <input type="number" id="p-orig" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white" placeholder="999">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Image URL (Laptop Photo)</label>
                    <input type="url" id="p-img" required class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white" placeholder="https://images.unsplash.com/photo-...">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 mb-1">Description & Specs</label>
                    <textarea id="p-desc" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-sm text-white" placeholder="16GB RAM, 512GB SSD..."></textarea>
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 text-black font-extrabold text-sm rounded-xl">Publish Product to Website Live</button>
            </form>
        </div>

        <!-- Live Store Inventory Preview -->
        <div class="glass-panel p-8 rounded-3xl space-y-6">
            <h2 class="text-xl font-extrabold text-cyan-400"><i class="fa-solid fa-boxes-stacked mr-2"></i> Live Store Inventory</h2>
            <div id="admin-product-list" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                <!-- Dynamically loaded products -->
            </div>
        </div>
    </div>

    <script>
        async function fetchAdminProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            const list = document.getElementById('admin-product-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <div class="p-4 bg-gray-900 rounded-xl flex items-center justify-between border border-gray-800 text-xs">
                        <div class="flex items-center gap-3">
                            <img src="${p.image_url}" class="w-12 h-12 object-cover rounded-lg">
                            <div>
                                <p class="font-bold text-white">${p.title}</p>
                                <p class="text-amber-400 font-bold">$${p.price}</p>
                            </div>
                        </div>
                        <button onclick="deleteProduct('${p._id}')" class="px-3 py-1 bg-rose-500 text-white font-bold rounded">Delete</button>
                    </div>
                `;
            });
        }

        async function addNewProduct(e) {
            e.preventDefault();
            const token = localStorage.getItem('eloance_token');
            const body = {
                title: document.getElementById('p-title').value,
                category: 'Refurbished',
                price: parseFloat(document.getElementById('p-price').value),
                original_price: parseFloat(document.getElementById('p-orig').value) || 0,
                image_url: document.getElementById('p-img').value,
                description: document.getElementById('p-desc').value,
                badge: 'New Arrival'
            };
            const res = await fetch('/api/admin/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(body)
            });
            if(res.ok) {
                alert('Product successfully published to live website!');
                fetchAdminProducts();
                e.target.reset();
            } else {
                alert('Unauthorized or error adding product. Please login as admin.');
            }
        }

        async function deleteProduct(id) {
            if(!confirm('Are you sure you want to remove this item?')) return;
            const token = localStorage.getItem('eloance_token');
            await fetch(`/api/admin/products/${id}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` } });
            fetchAdminProducts();
        }

        fetchAdminProducts();
    </script>
</body>
</html>
